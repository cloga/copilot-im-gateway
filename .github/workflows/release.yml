name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: npm
      - name: Validate release tag
        shell: pwsh
        run: |
          $version = node --print "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME must match package version v$version."
          }
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run release:package
      - run: npm run release:validate
      - name: Install pinned Inno Setup
        shell: pwsh
        run: |
          $compiler = & .\scripts\installer\install-inno-setup.ps1
          "ISCC_PATH=$compiler" >> $env:GITHUB_ENV
      - run: npm run release:installer
      - run: npm run release:installer:smoke
      - uses: actions/upload-artifact@v4
        with:
          name: copilot-im-gateway-${{ github.ref_name }}
          path: |
            release/*.tgz
            release/*.zip
            release/*.exe
            release/*.sha256
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "$env:GITHUB_REF_NAME" (Get-ChildItem release\*.tgz, release\*.zip, release\*.exe, release\*.sha256).FullName `
            --verify-tag `
            --generate-notes `
            --title "Copilot IM Gateway $env:GITHUB_REF_NAME"
