name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(node --print "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} must match package version v${version}." >&2
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run release:package
      - run: npm run release:validate
      - uses: actions/upload-artifact@v4
        with:
          name: copilot-im-gateway-${{ github.ref_name }}
          path: |
            release/*.tgz
            release/*.zip
            release/*.sha256
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release/*.tgz release/*.zip release/*.sha256
          --verify-tag
          --generate-notes
          --title "Copilot IM Gateway ${GITHUB_REF_NAME}"
